spring:
  application:
    name: mortgage-journey

  datasource:
    url: jdbc:h2:mem:mortgage;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true

  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console (dev convenience)

  ai:
    model:
      # Which LLM provider backs the agents: anthropic (default) or openai.
      # Set AI_PROVIDER in the environment to switch - no code change needed.
      chat: ${AI_PROVIDER:anthropic}
      # We only use chat; keep the OpenAI starter from wiring its other models.
      embedding: none
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    anthropic:
      # Set ANTHROPIC_API_KEY in the environment (or spring.ai.anthropic.api-key here).
      # When the selected provider has no key, the app falls back to the deterministic
      # stub agent - it still runs.
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          temperature: 0.3
    openai:
      # Used when AI_PROVIDER=openai. Set OPENAI_API_KEY in the environment.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # No temperature here: GPT-5-family models only accept the default.
          model: ${OPENAI_MODEL:gpt-5-mini}
          # Ask OpenAI to report token usage on streamed (chat) replies too.
          stream-options:
            include-usage: true

app:
  token-budget:
    # Daily LLM token budget. Once spent, the agents answer with the stub until midnight.
    # Default leaves ~10% headroom under the 5M/day gpt-5-mini limit, since the in-memory
    # count resets when the backend restarts.
    daily-limit: ${APP_DAILY_TOKEN_BUDGET:4500000}
    zone: ${APP_TOKEN_BUDGET_ZONE:Europe/Tallinn}
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    org.springframework.ai: INFO
