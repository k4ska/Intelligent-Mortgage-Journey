spring:
  application:
    name: mortgage-journey

  datasource:
    url: jdbc:h2:mem:mortgage;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true

  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console (dev convenience)

  ai:
    model:
      # The agents run on OpenAI. We only use chat; keep the OpenAI starter from wiring
      # its other models.
      chat: openai
      embedding: none
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    openai:
      # Set OPENAI_API_KEY in the environment. Without a key, the app runs in stub mode
      # (canned replies) - it still starts.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # No temperature here: GPT-5-family models only accept the default.
          model: ${OPENAI_MODEL:gpt-5-mini}
          # Ask OpenAI to report token usage on streamed (chat) replies too.
          stream-options:
            include-usage: true

app:
  agent:
    # How much hidden reasoning each agent does before answering (OpenAI GPT-5 family:
    # minimal, low, medium, high). Reasoning tokens are generated like visible output, so
    # they are most of the wait. Leave a value empty to use OpenAI's default. New agents
    # (advisor, document reader, bank) add their own key here.
    reasoning-effort:
      advisor: ${AGENT_REASONING_ADVISOR:low}
      verifier: ${AGENT_REASONING_VERIFIER:low}
  token-budget:
    # Daily LLM token budget. Once spent, the agents answer with the stub until midnight.
    # Default leaves ~10% headroom under the 5M/day gpt-5-mini limit, since the in-memory
    # count resets when the backend restarts.
    daily-limit: ${APP_DAILY_TOKEN_BUDGET:4500000}
    zone: ${APP_TOKEN_BUDGET_ZONE:Europe/Tallinn}
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    org.springframework.ai: INFO
