plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.seb'
version = '0.0.1-SNAPSHOT'
description = 'Intelligent Mortgage Journey - backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	springAiVersion = '2.0.1'
	flywayVersion = '12.4.0'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly "org.flywaydb:flyway-database-postgresql:${flywayVersion}"

	// OpenAI via Spring AI. With no OPENAI_API_KEY, the app falls back to the stub agent.
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'eval'
	}
}

// The advisor's test conversations (#74): scripted chats against the real model, each with
// checks on the outcome. They need OPENAI_API_KEY and cost tokens, so `test` skips them.
// Run each scenario several times with -Pruns=3; the pass rates go to build/advisor-eval.md.
tasks.register('advisorEval', Test) {
	description = 'Runs the advisor test conversations against the real model.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'eval'
	}
	systemProperty 'eval.runs', providers.gradleProperty('runs').getOrElse('1')
	outputs.upToDateWhen { false }
	// A scenario that fails sometimes is a result to report, not a broken build.
	ignoreFailures = true
	testLogging {
		events 'passed', 'failed'
		exceptionFormat 'full'
		showStandardStreams = false
	}
	doFirst {
		if (!System.getenv('OPENAI_API_KEY')) {
			throw new GradleException('advisorEval needs OPENAI_API_KEY in the environment')
		}
	}
	def results = new TreeMap<String, int[]>()
	afterTest { descriptor, result ->
		// Dynamic tests are named "<scenario> run <n>"; count passes per scenario.
		def scenario = descriptor.displayName.replaceAll(/ run \d+$/, '')
		def counts = results.computeIfAbsent(scenario) { new int[2] }
		counts[1]++
		if (result.resultType == TestResult.ResultType.SUCCESS) {
			counts[0]++
		}
	}
	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			def lines = ['| Scenario | Passed |', '| --- | --- |']
			results.each { name, counts -> lines << "| ${name} | ${counts[0]}/${counts[1]} |" }
			int passed = results.values().sum { it[0] } ?: 0
			int total = results.values().sum { it[1] } ?: 0
			lines << "| **All** | **${passed}/${total}** |"
			def report = layout.buildDirectory.file('advisor-eval.md').get().asFile
			report.text = lines.join('\n') + '\n'
			println "\nAdvisor eval, ${providers.gradleProperty('runs').getOrElse('1')} run(s) per scenario:\n" +
					lines.join('\n') + "\n(written to ${report})"
		}
	}
}
