
# `docker compose up --build` runs the whole app: backend on :8080, frontend on :3000.
# Set OPENAI_API_KEY in the environment (or a .env file next to this one) to use the
# real OpenAI-backed agents; leave it unset and the backend falls back to the
# deterministic stub agent, so the whole thing still runs without a key.
#
# Docker uses Postgres by default so user progress survives backend restarts. Local
# development can still run the backend directly on in-memory H2.
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      APP_DAILY_TOKEN_BUDGET: ${APP_DAILY_TOKEN_BUDGET:-4500000}
      AGENT_REASONING_ADVISOR: ${AGENT_REASONING_ADVISOR:-low}
      AGENT_REASONING_VERIFIER: ${AGENT_REASONING_VERIFIER:-low}
      SPRING_PROFILES_ACTIVE: postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_MOCK_API: ${NUXT_PUBLIC_MOCK_API:-false}
    depends_on:
      - backend

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mortgage
      POSTGRES_USER: mortgage
      POSTGRES_PASSWORD: mortgage
    ports:
      - "5432:5432"
    volumes:
      - mortgage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mortgage -d mortgage"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mortgage_pgdata:
